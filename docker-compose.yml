version: "3.9"

networks:
  backend-net:
    name: backend-net
    driver: bridge
  frontend-net:
    name: frontend-net
    driver: bridge

volumes:
  zkdata: {}
  kafka-logs: {}
  pgdata: {}
  checkpoint: {}

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    networks: [backend-net]
    volumes:
      - zkdata:/bitnami/zookeeper
      - ./logs/zookeeper:/opt/zookeeper/logs
      - ./config/zk-log4j.properties:/opt/zookeeper/conf/log4j.properties:ro
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports: ["2181:2181"]
    logging:                              
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  kafka:
    build: ./Infra/kafka
    container_name: kafka
    depends_on: [zookeeper]
    networks: [backend-net]
    volumes:
      - kafka-logs:/tmp/kafka-logs
      - ./logs/kafka:/opt/bitnami/kafka/logs
      - ./config/kafka-log4j.properties:/opt/bitnami/kafka/config/log4j.properties:ro
    ports: ["9092:9092"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1g"
      KAFKA_CFG_LOG_RETENTION_BYTES: "524288000"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
    logging:                              
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


  postgres:
    image: postgres:15
    container_name: postgres
    networks:
      - backend-net
      - frontend-net
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./logs/postgres:/var/log/postgres
    environment:
      POSTGRES_DB: openfood
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingestpwd
      POSTGRES_LOGGING_COLLECTOR: "on"
      POSTGRES_LOG_DEST: stderr
      POSTGRES_LOG_DIRECTORY: /var/log/postgres
    ports: ["5433:5432"]
    logging:                             
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  producer:
    build:
      context: .
      dockerfile: src/main/scala/com/esgi/Producer/Dockerfile
    container_name: producer
    depends_on: [kafka]
    networks: [backend-net]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USE_API: "true"
      BATCH_LENGTH: "100"
      MAX_OFFSET: "3808300"
    volumes:
      - ./data:/app/data
      - ./logs/producer:/var/log/producer
      - /config/producer-log4j.properties:/opt/spark/conf/log4j.properties:ro
    logging:                              
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  consumer:
    build:
      context: .
      dockerfile: src/main/scala/com/esgi/Consumer/Dockerfile
    container_name: consumer
    depends_on: [kafka, postgres]
    networks: [backend-net]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHECKPOINT_PATH: /checkpoint/generic
      PG_URL: jdbc:postgresql://postgres:5432/openfood
      PG_USER: ingest
      PG_PWD: ingestpwd
    volumes:
      - checkpoint:/checkpoint
      - ./logs/consumer:/var/log/consumer
      - /config/consumer-log4j.properties:/opt/spark/conf/log4j.properties:ro
    logging:                              
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: streamlit
    depends_on: [postgres]
    networks: [frontend-net]
    ports:
      - "8501:8501"
    volumes:
      - /logs/streamlit:/var/log/streamlit
    command: >
      /bin/sh -c "streamlit run app.py
                  2>&1 | tee /var/log/streamlit/app.log"
    logging:                              
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
